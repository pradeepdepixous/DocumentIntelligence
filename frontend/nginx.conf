server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default nginx limit is 1MB, too small for PDF uploads. Raise to 50MB.
    client_max_body_size 50M;

    # Proxy API calls to the backend container (see docker-compose.yml service name "api").
    # Trailing slash on the location mirrors the dev-server proxy in vite.config.ts so
    # '/api-access' (a React Router page) is not swallowed by this prefix match.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger {
        proxy_pass http://api:8080/swagger;
        proxy_set_header Host $host;
    }

    # React Router client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
